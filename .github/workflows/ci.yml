name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint Python
        run: ruff check src tests scripts airflow
      - name: Run unit and integration tests
        run: pytest -q
      - name: Validate project structure and secret hygiene
        run: python scripts/check_project.py
      - name: Compile Python modules
        run: python -m compileall -q src scripts airflow

