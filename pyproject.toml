[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-saas-elt-platform"
version = "1.0.0"
description = "Production-style SaaS ELT platform using Python, Airflow, Snowflake, and dbt"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Subhadeep Deb"}]
dependencies = [
  "boto3>=1.34,<2",
  "requests>=2.31,<3",
  "snowflake-connector-python>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "PyYAML>=6,<7",
]
orchestration = ["apache-airflow>=2.9,<3"]
transformation = ["dbt-snowflake>=1.8,<2"]

[project.scripts]
saas-elt = "saas_elt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

